name: retag

# Copies existing multi-arch manifest lists to additional tags, without rebuilding.
# Used to backfill floating MAJOR.MINOR tags for releases published before
# `.github/workflows/docker.yml` started emitting them. Digests are unchanged.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Existing tag to copy from, e.g. 1.10.1
        required: true
      targets:
        description: Space separated tags to point at the source, e.g. "1.10"
        required: true
      images:
        description: Space separated image repositories
        required: false
        default: ghcr.io/cshum/imagor ghcr.io/cshum/imagor-magick ghcr.io/cshum/imagor-mozjpeg docker.io/shumc/imagor

jobs:
  retag:
    name: Retag
    runs-on: ubuntu-latest
    if: github.repository == 'cshum/imagor'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag
        env:
          SOURCE: ${{ inputs.source }}
          TARGETS: ${{ inputs.targets }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            args=()
            for target in $TARGETS; do
              args+=("--tag" "$image:$target")
            done
            echo "== $image:$SOURCE -> $TARGETS =="
            docker buildx imagetools create "${args[@]}" "$image:$SOURCE"
          done
